name: Build & Release

on:
  push:
    branches: [main]
    tags:
      - "v*.*.*"
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    name: Build Windows Executable
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build -c Release --no-restore

      - name: Publish single-file exe
        run: |
          dotnet publish -c Release -r win-x64 --self-contained `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:EnableCompressionInSingleFile=true `
            -o publish

      - name: Copy config
        run: Copy-Item config.json publish\config.json -Force

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: MicAlert-win-x64
          path: |
            publish/MicAlert.exe
            publish/config.json
          retention-days: 30

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    # Run on every push to main and on version tags; skip for pull requests
    if: github.event_name == 'push'

    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: MicAlert-win-x64
          path: publish

      - name: Set release metadata
        id: meta
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "tag=${GITHUB_REF_NAME}"          >> "$GITHUB_OUTPUT"
            echo "name=MicAlert ${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
            echo "prerelease=false"                 >> "$GITHUB_OUTPUT"
          else
            echo "tag=latest"                       >> "$GITHUB_OUTPUT"
            echo "name=MicAlert (latest build)"     >> "$GITHUB_OUTPUT"
            echo "prerelease=true"                  >> "$GITHUB_OUTPUT"
          fi

      - name: Create zip archive
        run: |
          cd publish
          zip -j ../MicAlert-${{ steps.meta.outputs.tag }}-win-x64.zip MicAlert.exe config.json

      - name: Delete existing 'latest' release and tag
        if: steps.meta.outputs.tag == 'latest'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag -R ${{ github.repository }} 2>/dev/null || true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: ${{ steps.meta.outputs.name }}
          prerelease: ${{ steps.meta.outputs.prerelease }}
          files: MicAlert-${{ steps.meta.outputs.tag }}-win-x64.zip
          body: |
            ## ${{ steps.meta.outputs.name }}

            ### Download
            Download **MicAlert.exe** below — no installation required, just run it.

            > **Requirements:** Windows 10/11 × 64-bit

            ### What's in the zip
            - `MicAlert.exe` — self-contained executable (no .NET install needed)
            - `config.json` — default configuration file

            ### How to use
            1. Extract the zip
            2. Run `MicAlert.exe`
            3. The app appears in your system tray
            4. Double-click the tray icon to configure
